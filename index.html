<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><span class="brand">LiftLog</span><span class="toplinks"><span id="account" aria-live="polite"></span><a href="https://mgmacri.github.io/mealplan/">MealPlan →</a></span></header>
  <main id="app"></main>
  <div id="timer" hidden role="timer">
    <span class="lbl">Rest</span><span class="t">0:00</span>
    <button data-a="tminus" aria-label="30 seconds less">−30</button>
    <button data-a="tplus" aria-label="30 seconds more">+30</button>
    <button data-a="tskip">Skip</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
